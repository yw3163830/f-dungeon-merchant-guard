<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F级地下城商人：守城佣兵版</title>
<meta name="theme-color" content="#151b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="地下城商人">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
/* ===== 像素风基础 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-dark: #1a1a2e;
  --bg-panel: #16213e;
  --bg-panel2: #0f3460;
  --accent: #e94560;
  --accent2: #f39c12;
  --text: #eaeaea;
  --text-dim: #a0a0a0;
  --border: #2d3561;
  --green: #27ae60;
  --red: #c0392b;
  --gold: #f1c40f;
}

body {
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px;
}

/* 像素边框 */
.pixel-border {
  border: 3px solid var(--border);
  box-shadow: 
    inset 0 0 0 2px var(--bg-panel2),
    4px 4px 0 rgba(0,0,0,0.3);
}

/* ===== 游戏容器 ===== */
#game-container {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ===== 标题 ===== */
#game-title {
  text-align: center;
  padding: 15px;
  background: var(--bg-panel);
  pixel-border: 3px solid var(--border);
}
#game-title h1 {
  font-size: 24px;
  color: var(--accent2);
  text-shadow: 2px 2px 0 var(--bg-dark);
  letter-spacing: 2px;
}
#game-title .subtitle {
  color: var(--text-dim);
  font-size: 12px;
  margin-top: 5px;
}

/* ===== 状态栏 ===== */
#status-bar {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 15px;
  background: var(--bg-panel);
  pixel-border: 3px solid var(--border);
}
.status-item {
  display: flex;
  align-items: center;
  gap: 5px;
}
.status-item .icon { font-size: 16px; }
.status-item .value { color: var(--accent2); font-weight: bold; }

/* ===== 主区域 ===== */
#main-area {
  display: flex;
  gap: 10px;
  flex: 1;
  min-height: 400px;
}

/* ===== 日志面板 ===== */
#log-panel {
  flex: 2;
  background: var(--bg-panel);
  pixel-border: 3px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#log-header {
  padding: 8px 12px;
  background: var(--bg-panel2);
  border-bottom: 2px solid var(--border);
  font-weight: bold;
  color: var(--accent2);
}
#log-content {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  max-height: 500px;
}
#log-content .log-entry {
  margin-bottom: 8px;
  padding: 4px 0;
  border-bottom: 1px dashed rgba(255,255,255,0.05);
}
#log-content .log-entry.highlight {
  color: var(--accent2);
  font-weight: bold;
}
#log-content .log-entry.success { color: var(--green); }
#log-content .log-entry.danger { color: var(--red); }
#log-content .log-entry.gold { color: var(--gold); }
#log-content .log-entry.info { color: #3498db; }
#log-content .log-entry.dim { color: var(--text-dim); }
#log-content .log-entry.story { color: #d7bde2; border-left: 3px solid #9b59b6; padding-left: 8px; }
.meter { display:inline-block; width:120px; height:10px; background:#0b1225; border:1px solid var(--border); vertical-align:middle; margin-left:6px; }
.meter > span { display:block; height:100%; background:var(--green); }

/* ===== 操作面板 ===== */
#action-panel {
  flex: 1;
  min-width: 200px;
  background: var(--bg-panel);
  pixel-border: 3px solid var(--border);
  display: flex;
  flex-direction: column;
}
#action-header {
  padding: 8px 12px;
  background: var(--bg-panel2);
  border-bottom: 2px solid var(--border);
  font-weight: bold;
  color: var(--accent);
}
#action-buttons {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}

/* ===== 按钮 ===== */
.btn {
  padding: 10px 14px;
  background: var(--bg-panel2);
  color: var(--text);
  border: 2px solid var(--border);
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  text-align: left;
  transition: all 0.1s;
  position: relative;
}
.btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn:disabled:hover {
  background: var(--bg-panel2);
  color: var(--text);
  border-color: var(--border);
}
.btn.primary { border-left: 4px solid var(--accent); }
.btn.success { border-left: 4px solid var(--green); }
.btn.gold { border-left: 4px solid var(--gold); }
.btn.danger { border-left: 4px solid var(--red); }

/* ===== 物品卡片 ===== */
.item-card {
  background: var(--bg-panel2);
  border: 2px solid var(--border);
  padding: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.1s;
}
.item-card:hover {
  border-color: var(--accent);
}
.item-card.selected {
  border-color: var(--accent2);
  background: rgba(243, 156, 18, 0.1);
}
.item-card .item-name {
  font-weight: bold;
  color: var(--accent2);
}
.item-card .item-quality {
  font-size: 11px;
  color: var(--text-dim);
}
.item-card .item-desc {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
}
.item-card .item-price {
  font-size: 12px;
  color: var(--gold);
  margin-top: 4px;
}

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
}
.modal {
  background: var(--bg-panel);
  border: 3px solid var(--border);
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-header {
  padding: 12px 16px;
  background: var(--bg-panel2);
  border-bottom: 2px solid var(--border);
  font-weight: bold;
  color: var(--accent2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-close {
  background: none;
  border: none;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
}
.modal-body {
  padding: 16px;
}
.modal-footer {
  padding: 12px 16px;
  border-top: 2px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ===== 鉴定动画 ===== */
@keyframes appraise-flash {
  0% { background: var(--bg-panel2); }
  50% { background: rgba(233, 69, 96, 0.3); }
  100% { background: var(--bg-panel2); }
}
.appraise-anim {
  animation: appraise-flash 0.5s ease-in-out 3;
}

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-panel); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ===== 响应式 ===== */
@media (max-width: 700px) {
  #main-area { flex-direction: column; }
  #action-panel { min-width: auto; }
  #log-content { max-height: 350px; }
}

/* ===== 宝箱闪动画 ===== */
@keyframes treasure-glow {
  0%, 100% { box-shadow: 0 0 5px var(--gold); }
  50% { box-shadow: 0 0 20px var(--gold), 0 0 40px var(--accent2); }
}
.treasure-glow {
  animation: treasure-glow 1s ease-in-out infinite;
}

/* ===== 守城佣兵版视觉升级 ===== */
body { background: radial-gradient(circle at 15% 0%, #253867 0, #151b35 42%, #0b1021 100%); font-family: "Noto Sans SC", "Microsoft YaHei", "Courier New", sans-serif; padding: 20px; }

@media (max-width:1000px) { #status-bar { grid-template-columns:repeat(4,1fr); } #main-area { flex-wrap:wrap; } #roster-panel { flex:1; min-width:260px; } }
@media (max-width:700px) { body{padding:8px} #status-bar{grid-template-columns:repeat(3,1fr)} #main-area{flex-direction:column} #roster-panel{width:100%} }
</style>

const SAVE_KEY = "f_dungeon_merchant_guard_v1";
let gameBooted = false;
function saveGame() {
  if (gameBooted) localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}
function restoreGame() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!saved || typeof saved !== "object") return false;
    state = { ...state, ...saved, defense: { ...state.defense, ...(saved.defense || {}) } };
    return true;
  } catch (_) { return false; }
}

// ===== 物品生成 =====
function generateItem(dungeonLevel) {
  // 40%概率出真实物品
  if (randf() < 0.4) {
    const keys = Object.keys(ITEMS);
    // 按地下城等级过滤
    let candidates = keys;
    if (dungeonLevel === "F") {
      candidates = keys.filter(k => k.startsWith("F"));
    } else if (dungeonLevel === "E") {
      candidates = keys.filter(k => k.startsWith("E") || k.startsWith("F"));
    } else if (dungeonLevel === "D") {
      candidates = keys.filter(k => k.startsWith("D") || k.startsWith("E") || k.startsWith("F"));
    }
    if (candidates.length === 0) candidates = keys;
    const key = pick(candidates);
    const item = ITEMS[key];
    return {
      ...item,
      key: key,
      acquiredPrice: 0,
      isAppraised: false,
      listedPrice: 0,
    };
  }
  // 60%概率出垃圾
  const junk = pick(JUNK_ITEMS);
  return {
    key: "JUNK_" + rand(9999),
    name: junk.name,
    quality: junk.quality,
    desc: junk.desc,
    trueName: junk.name,
    trueQuality: "F",
    category: "杂物",
    buy: junk.buy,
    sell: junk.sell,
    effect: "无",
    lore: "普通的地下城垃圾。",
    contrast: "trash_to_trash",
    difficulty: 1,
    acquiredPrice: 0,
    isAppraised: false,
    listedPrice: 0,
  };
}

function rankColor(rank) {
  return ({R:"#7fb3d5", SR:"#9b59b6", SSR:"#f5b041", UR:"#e74c3c"})[rank] || "#fff";

function typeIcon(type) {
  return ({combat:"⚔️", work:"🏪", support:"✦"})[type] || "🧑";
}

function recruitMercenary() {
  if (state.recruitTokens > 0) state.recruitTokens--;
  else {
    if (state.gold < 80) return showMercenaryHall();
    state.gold -= 80;
    state.today.expenses += 80;
  }
  let rank;
  if (state.recruitPity >= 9) rank = randf() < 0.08 ? "UR" : "SSR";
  else {
    const roll = randf();
    rank = roll < .62 ? "R" : roll < .88 ? "SR" : roll < .985 ? "SSR" : "UR";
  }
  state.recruitPity = (rank === "SSR" || rank === "UR") ? 0 : state.recruitPity + 1;
  const pool = MERCENARY_POOL.filter(m => m.rank === rank);
  const recruit = pick(pool);
  clearLog();
  log("<b>✦ 契约在夜色中燃烧…</b>", "highlight");
  log(`<span style="color:${rankColor(recruit.rank)};font-size:18px"><b>[${recruit.rank}] ${recruit.name}</b></span>`);
  log(`${recruit.role}｜特质：<b>${recruit.trait}</b>`);
  log(recruit.desc, "info");
  if (state.mercenaries.some(m => m.id === recruit.id)) {
    state.gold += 35;
    log("这位佣兵已经在你的队伍中，留下 35G 安置金后离开。", "gold");
  } else {
    state.mercenaries.push({...recruit});
    log(`🤝 ${recruit.name} 加入了店铺与城防队。`, "success");
    if (recruit.id === "sera") log("瑟拉压低声音：‘殿下，终于找到您了。先别问——城墙外有人在等答案。’", "story");

  updateStatus();
  renderButtons([
    { text:"🎴 再雇佣一次", action:recruitMercenary, type:"gold", disabled: !state.recruitTokens && state.gold < 80 },
    { text:"🧑‍🤝‍🧑 查看队伍", action:showMercenaryHall, type:"primary" },

}

function resolveDefense(tactic) {
  const event = currentSiege();
  let team = state.mercenaries.reduce((sum, m) => sum + m.battle, 0);
  const hasScout = state.mercenaries.some(m => m.id === "nora");
  const hasArcher = state.mercenaries.some(m => m.id === "cass");
  const hasCommander = state.mercenaries.some(m => m.id === "sera");
  if (state.mercenaries.some(m => m.id === "rowan") && (event.type === "叛乱" || event.type === "邻国")) team += 25;
  if (state.defense.royalTruth && state.mercenaries.some(m => m.id === "aurelia")) team += 20 * state.mercenaries.length;
  if (hasScout) team += 8;
  const tacticPower = tactic === "tower" ? 20 + (hasArcher ? 12 : 0) : tactic === "aid" ? 45 : 10;
  if (tactic === "aid") { state.gold -= 50; state.today.expenses += 50; }
  const defensePower = Math.floor(state.defense.wall * .24 + team + state.reputation * 2 + tacticPower + rand(21));
  const enemyPower = event.strength + rand(21) - (hasScout ? 6 : 0);
  const win = defensePower >= enemyPower;
  const hasShield = state.mercenaries.some(m => m.id === "garr");
  const hasHealer = state.mercenaries.some(m => m.id === "elise");
  const damage = Math.max(4, Math.floor((enemyPower - (win ? defensePower * .45 : defensePower * .12)) / 3) + 10 - (hasShield ? 5 : 0) - (hasHealer && !win ? 12 : 0));
  state.defense.wall = clamp(state.defense.wall - damage, 0, state.defense.maxWall);
  clearLog();
  log("<b>⚔️ 守城战报</b>", "highlight");
  log(`我方战力 ${defensePower} vs 敌军 ${enemyPower}`);
  if (win) {
    const reward = 70 + state.defense.cycle * 45;
    const repGain = 2 + (hasCommander ? 2 : 0);
    state.gold += reward; state.reputation += repGain; state.recruitTokens++;
    log(`🏆 守住了！城民赠予 ${reward}G，信誉 +${repGain}，并送来 1 张佣兵契约。`, "success");
    if (state.defense.cycle === 0) log("狼群退去后，城门下留下半枚王家徽章。有人在逼你承认血脉。", "story");
  } else {
    const loss = Math.min(state.gold, 25 + state.defense.cycle * 15);
    state.gold -= loss; state.reputation = Math.max(0, state.reputation - 1);
    log(`⚠️ 城门失守一角。损失 ${loss}G，信誉 -1，但你们仍守住了内城。`, "danger");
  }
  log(`城墙损伤 ${damage} 点，剩余 ${state.defense.wall}/${state.defense.maxWall}。`, state.defense.wall < 35 ? "danger" : "info");
  state.defense.cycle++; state.defense.nextDay += 5; state.phase = "morning";
  updateStatus();
  renderButtons([{ text:"🌅 处理店铺事务", action:showMainMenu, type:"success" }]);
}

function getQualityColor(q) {

}

// ===== 货架管理 =====
function showShelf() {
  clearLog();
  log("<b>🏪 货架管理</b>", "highlight");
  const cfg = SHOP_LEVELS[state.shopLevel];
  log(`货架: ${state.shelf.length}/${cfg.shelf} 格`);
  log("");

  if (state.shelf.length === 0) {
    log("(货架上什么都没有，顾客会空手而归)");
  } else {
    state.shelf.forEach((invIdx, shelfIdx) => {
      const item = state.inventory[invIdx];
      const name = item.isAppraised ? item.trueName : item.name;
      const price = item.listedPrice || 0;
      log(`[${shelfIdx}] ${name} — ${price}G`);
    });
  }

  log("");
  log("点击物品可以上架/下架:");

  // 生成上架按钮列表
  const itemButtons = [];
  state.inventory.forEach((item, i) => {
    const onShelf = state.shelf.includes(i);
    itemButtons.push({
      text: (onShelf ? "⬇️ " : "⬆️ ") + item.name + (item.isAppraised ? " → " + item.trueName : ""),
      action: () => toggleShelf(i),
      type: onShelf ? "danger" : "success"
    });
  });

  renderButtons([
    ...itemButtons,
    { text: "🔙 返回", action: showMainMenu }
  ]);
}

function toggleShelf(invIdx) {
  const shelfIdx = state.shelf.indexOf(invIdx);
  const cfg = SHOP_LEVELS[state.shopLevel];

  if (shelfIdx >= 0) {
    // 下架
    state.shelf.splice(shelfIdx, 1);
    log(`⬇️ 已下架: ${state.inventory[invIdx].name}`);
  } else {
    // 上架
    if (state.shelf.length >= cfg.shelf) {
      log("❌ 货架已满！", "danger");
      return;
    }
    const item = state.inventory[invIdx];
    if (!item.isAppraised) {
      log("⚠️ 未鉴定的物品不建议上架（顾客可能发现你在坑他）");
    }
    // 自动定价
    if (!item.listedPrice) {
      item.listedPrice = item.isAppraised ? item.sell : Math.max(1, Math.floor(item.buy * 1.5));
    }
    state.shelf.push(invIdx);
    log(`⬆️ 已上架: ${item.name} — ${item.listedPrice}G`);
  }
  updateStatus();
}

function showBuyFromAdventurer() {
  clearLog();
  log("<b>🤝 冒险者上门卖货</b>", "highlight");
  log("");

  // 生成3个报价
  const offers = [];
  for (let i = 0; i < 3; i++) {
    const item = generateItem(state.shopLevel);
    const askPrice = Math.floor(item.buy * (1.2 + randf() * 1.5));
    offers.push({ item, askPrice });
  }

  offers.forEach((offer, i) => {
    log(`[${i+1}] ${offer.item.name} (${offer.item.quality})`);
    log(`    冒险者要价: <b>${offer.askPrice}G</b>`);
    log(`    "${offer.item.desc}"`);
    log("");
  });

  renderButtons([
    { text: `✅ 买 #1 (${offers[0].askPrice}G)`, action: () => buyItem(offers[0]), type: "primary" },
    { text: `✅ 买 #2 (${offers[1].askPrice}G)`, action: () => buyItem(offers[1]), type: "primary" },
    { text: `✅ 买 #3 (${offers[2].askPrice}G)`, action: () => buyItem(offers[2]), type: "primary" },
    { text: "🔙 不买了", action: showMainMenu }
  ]);
}

function buyItem(offer) {
  if (state.gold < offer.askPrice) {
    log("❌ 资金不足！", "danger");
    return;
  }
  const cfg = SHOP_LEVELS[state.shopLevel];
  if (state.inventory.length >= cfg.inv) {
    log("❌ 库存满了！", "danger");
    return;
  }

  state.gold -= offer.askPrice;
  state.today.expenses += offer.askPrice;
  offer.item.acquiredPrice = offer.askPrice;
  state.inventory.push(offer.item);

  log(`✅ 收购成功: ${offer.item.name} — ${offer.askPrice}G`, "success");
  updateStatus();

  // 返回收购界面
  setTimeout(showBuyFromAdventurer, 300);
}

// ===== 鉴定系统 =====
function showAppraisal() {
  clearLog();
  log("<b>🔍 鉴定物品</b>", "highlight");
  log("选择要鉴定的物品:");
  log("");

  const unappraised = state.inventory.filter((item, i) => !item.isAppraised);

  if (unappraised.length === 0) {
    log("(所有物品都已鉴定)");
    renderButtons([{ text: "🔙 返回", action: showMainMenu }]);
    return;
  }

  const buttons = [];
  state.inventory.forEach((item, i) => {
    if (!item.isAppraised) {
      buttons.push({
        text: `[${i}] ${item.name} — 浅层10G / 中层30G / 深层80G / 完全200G`,
        action: () => showAppraisalDetail(i),
        type: "primary"
      });
    }
  });
  buttons.push({ text: "🔙 返回", action: showMainMenu });

  renderButtons(buttons);
}

function showAppraisalDetail(invIdx) {
  const item = state.inventory[invIdx];
  clearLog();
  log(`<b>🔍 鉴定: ${item.name}</b>`, "highlight");
  log(`描述: ${item.desc}`);
  log(`当前资金: ${state.gold}G`);
  log("");

  const buttons = APPRAISAL_LAYERS.map((layer, i) => ({
    text: `${layer.name} — ${layer.cost}G (${layer.desc})`,
    action: () => doAppraisal(invIdx, i),
    type: state.gold >= layer.cost ? "primary" : "",
    disabled: state.gold < layer.cost
  }));
  buttons.push({ text: "🔙 返回", action: showAppraisal });

  renderButtons(buttons);
}

function doAppraisal(invIdx, layerIdx) {
  const item = state.inventory[invIdx];
  const layer = APPRAISAL_LAYERS[layerIdx];

  if (state.gold < layer.cost) {
    log("❌ 资金不足！", "danger");
    return;
  }

  state.gold -= layer.cost;
  state.today.expenses += layer.cost;

  clearLog();
  log(`<b>🔍 ${layer.name}中...</b>`, "highlight");
  log(`花费: ${layer.cost}G`);
  log("");

  // 模拟鉴定过程
  setTimeout(() => {
    // 计算是否看错（准确度）
    const roll = randf();
    const success = roll <= layer.accuracy;

    if (!success) {
      // 看错：给一个随机的错误提示
      const fakeQualities = ["F", "E", "D", "C"];
      const fake = pick(fakeQualities);
      log(`💡 品质暗示: <b>${fake}级</b>`, "info");
      log("（你的鉴定之眼有些模糊...）", "dim");
    } else {
      // 看对
      log(`💡 品质暗示: <b>${item.trueQuality}级</b>`, "info");

      if (layerIdx >= 1) {
        const hasEffect = item.effect !== "无";
        log(`✨ 特殊效果: ${hasEffect ? "有" : "无"}`, hasEffect ? "success" : "dim");
      }
      if (layerIdx >= 2) {
        log(`🔮 效果: ${item.effect}`, "info");
      }
      if (layerIdx >= 3) {
        // 完全鉴定
        log("");
        log("<b>🎉 完全鉴定！！！</b>", "highlight");
        log(`真名: <span style="color:${getQualityColor(item.trueQuality)};font-size:16px"><b>${item.trueName}</b></span>`);
        log(`真实品质: <b>${item.trueQuality}级</b>`);
        log(`效果: ${item.effect}`);
        log(`"${item.lore}"`, "dim");
        log("");

        // 高价值提示
        if (item.sell > 1000) {
          log(`💰 建议售价: <b>${item.sell}G</b>`, "gold");
          if (item.acquiredPrice > 0) {
            const profit = item.sell - item.acquiredPrice;
            log(`📈 潜在利润: ${profit}G (${Math.floor(profit/item.acquiredPrice*100)}%)`, "gold");
          }
        }

        item.isAppraised = true;
        item.listedPrice = item.sell;
      }
    }

    updateStatus();
    renderButtons([
      { text: "🔍 继续鉴定其他", action: showAppraisal, type: "primary" },
      { text: "🔙 返回主菜单", action: showMainMenu }
    ]);
  }, 600);
}

// ===== 地下城拾荒 =====
function goScavenge() {
  if (state.dungeonCooldown > 0) {
    log(`⏳ 还需要 ${state.dungeonCooldown} 天恢复体力`, "danger");
    return;
  }

  state.dungeonCooldown = 2;
  clearLog();
  log("<b>⚔️ 前往地下城...</b>", "highlight");
  log("");

  const rooms = rand(3) + 2; // 2-4个房间
  let itemsFound = [];
  let goldFound = 0;
  let damage = 0;

  log("你进入了F级地下城...");

  for (let i = 0; i < rooms; i++) {
    const roll = randf();
    if (roll < 0.45) {
      const item = generateItem("F");
      itemsFound.push(item);
      log(`在第${i+1}个房间，你发现了一件<b>${item.name}</b>`);
    } else if (roll < 0.65) {
      const g = rand(20) + 5;
      goldFound += g;
      log(`你在角落里找到了<b>${g}G</b>`, "gold");
    } else if (roll < 0.85) {
      const dmg = rand(10) + 5;
      damage += dmg;
      log(`你遭遇了一只怪物，受了<b>${dmg}点伤</b>`, "danger");
    } else {
      log("你发现了一些奇怪的痕迹...", "dim");
    }
  }

  if (itemsFound.length === 0 && goldFound === 0 && damage === 0) {
    log("你搜遍了每个房间，但什么也没找到。空手而归。", "dim");
  } else {
    log("你带着战利品离开了地下城。", "success");
  }

  log("");
  if (itemsFound.length > 0) {
    log(`<b>🎒 找到 ${itemsFound.length} 件物品:</b>`, "success");
    itemsFound.forEach(item => {
      state.inventory.push(item);
      log(`  - ${item.name} (${item.quality})`);
    });
  }
  if (goldFound > 0) {
    state.gold += goldFound;
    log(`<b>💰 找到金币: ${goldFound}G</b>`, "gold");
  }
  if (damage > 0) {
    log(`💔 受伤: ${damage}点`, "danger");
  }

  updateStatus();
  renderButtons([
    { text: "🔍 鉴定新物品", action: showAppraisal, type: "primary" },
    { text: "📦 查看库存", action: showInventory },
    { text: "🔙 返回", action: showMainMenu }
  ]);
}

// ===== 接待顾客 =====
function serveCustomer() {
  // 检查货架
  if (state.shelf.length === 0) {
    clearLog();
    log("🏪 货架上空空如也...", "danger");
    log("先上架一些商品再接待顾客吧。");
    renderButtons([
      { text: "🏪 整理货架", action: showShelf, type: "primary" },
      { text: "🔙 返回", action: showMainMenu }
    ]);
    return;
  }

  // 生成顾客
  const roll = randf();
  let cType = "novice";
  if (state.shopLevel === "F" || state.shopLevel === "E") {
    if (roll < 0.8) cType = "novice";
    else cType = "experienced";
  } else if (state.shopLevel === "D" || state.shopLevel === "C") {
    if (roll < 0.3) cType = "novice";
    else if (roll < 0.8) cType = "experienced";
    else cType = "noble";
  } else {
    if (roll < 0.2) cType = "novice";
    else if (roll < 0.5) cType = "experienced";
    else cType = "noble";
  }

  const customer = { ...CUSTOMERS[cType], type: cType };
  currentCustomer = customer;
  state.today.customers++;

  clearLog();
  log(`<b>🚪 一位顾客走进了店里！</b>`, "highlight");
  log("");
  log(`<span style="color:${customer.color}"><b>👤 ${customer.name}</b> [${customer.title}]</span>`);

  // 顾客入场对话
  const enterLines = [
    `"老板，让我看看你有什么货。"`,
    `"听说你这里有些特别的东西？"`,
    `"我随便看看..."`,
    `"有适合我的装备吗？"`,
  ];
  log(pick(enterLines), "dim");
  log("");

  // 显示货架让顾客选
  log("顾客对以下商品感兴趣:");
  const buttons = [];
  state.shelf.forEach((invIdx, shelfIdx) => {
    const item = state.inventory[invIdx];
    const name = item.isAppraised ? item.trueName : item.name;
    const price = item.listedPrice || Math.max(1, item.buy * 2);
    buttons.push({
      text: `[${shelfIdx}] ${name} — ${price}G`,
      action: () => negotiateSale(shelfIdx, customer),
      type: "primary"
    });
  });
  buttons.push({ text: "👋 请顾客离开", action: showMainMenu });

  renderButtons(buttons);
}

function negotiateSale(shelfIdx, customer) {
  const invIdx = state.shelf[shelfIdx];
  const item = state.inventory[invIdx];
  const askingPrice = item.listedPrice || Math.max(1, item.buy * 2);

  clearLog();
  log(`<b>💬 与 ${customer.name} 的交易</b>`, "highlight");
  log("");

  // 顾客评估价格
  const perceivedValue = item.isAppraised
    ? item.sell * (0.5 + customer.appraisal * 0.5)
    : item.buy * (1 + customer.appraisal * 2);

  log(`你的要价: <b>${askingPrice}G</b>`);
  log(`${customer.name}的心理价位: ~${Math.floor(perceivedValue)}G`);
  log("");

  // 成交判定
  let sold = false;
  let finalPrice = askingPrice;
  let repChange = 0;

  if (askingPrice <= perceivedValue * 1.5) {
    // 价格合理或偏低，直接成交
    sold = true;
    if (askingPrice <= perceivedValue * 0.7) {
      log(`💰 <b>成交！</b> ${customer.name}毫不犹豫地买下了。`, "success");
      repChange = 1;
    } else {
      log(`💰 <b>成交！</b> ${customer.name}想了想，接受了价格。`, "success");
    }
  } else if (askingPrice <= perceivedValue * 2.5 && customer.patience > 0) {
    // 可以尝试砍价
    const haggleCount = Math.min(customer.patience, 3);
    for (let i = 0; i < haggleCount; i++) {
      const offer = Math.floor(askingPrice * (0.6 + randf() * 0.3));
      log(`${customer.name}: "${offer}G，一口价。"`);
      if (offer >= perceivedValue * 0.8) {
        finalPrice = offer;
        sold = true;
        log(`💰 <b>成交！</b> 你接受了 ${offer}G。`, "success");
        break;
      } else {
        log(`你摇了摇头。`);
      }
    }
    if (!sold) {
      log(`${customer.name}: "太贵了，我去别家看看。"`, "danger");
    }
  } else {
    log(`${customer.name}皱了皱眉: "这是抢劫吗？"`, "danger");
    log(`${customer.name}转身离开了。`);
    repChange = -1;
  }

  if (sold) {
    // 完成交易
    state.gold += finalPrice;
    state.today.revenue += finalPrice;
    state.today.sales++;
    state.reputation += repChange;

    // 从货架和库存移除
    state.shelf.splice(shelfIdx, 1);
    state.inventory.splice(invIdx, 1);
    // 修正货架索引
    state.shelf = state.shelf.map(idx => idx > invIdx ? idx - 1 : idx);

    log(`"${pick(["不错，下次还来。", "值这个价。", "好货色！"])}"`, "dim");
    if (repChange > 0) log("⭐ 信誉 +1", "info");
  }

  updateStatus();
  renderButtons([
    { text: "👤 接待下一位", action: serveCustomer, type: "primary" },
    { text: "🔙 返回", action: showMainMenu }
  ]);
}

// ===== 打烊结算 =====
function endDay() {
  state.phase = "evening";
  showMainMenu();
}

function showDaySummary() {
  clearLog();
  log("<b>📊 今日结算</b>", "highlight");
  log("═══════════════════════════════");
  log(`📅 第 ${state.day} 天`);
  log(`💰 收入: <b>${state.today.revenue}G</b>`, "gold");
  log(`💸 支出: <b>${state.today.expenses}G</b>`);
  log(`📈 净利: <b>${state.today.revenue - state.today.expenses}G</b>`);
  log(`👥 顾客: ${state.today.customers}人`);
  log(`🤝 成交: ${state.today.sales}笔`);
  log(`💵 结余: <b>${state.gold}G</b>`, "gold");
  log(`⭐ 信誉: ${state.reputation}`);
  log("═══════════════════════════════");

  // 每日结算只能执行一次，避免重复点开结算反复扣费。
  if (state.defense.lastSettledDay !== state.day) {
    const cfg = SHOP_LEVELS[state.shopLevel];
    const shopIncome = state.mercenaries.reduce((sum, m) => sum + m.shop, 0);
    const wallRepair = state.mercenaries.reduce((sum, m) => sum + m.wall, 0);
    state.gold -= cfg.dailyCost;
    state.gold += shopIncome;
    state.today.revenue += shopIncome;
    state.defense.wall = clamp(state.defense.wall + wallRepair, 0, state.defense.maxWall);
    state.defense.lastSettledDay = state.day;
    log(`🏪 ${cfg.name} 维护费: -${cfg.dailyCost}G`);
    if (shopIncome) log(`🧑‍🤝‍🧑 佣兵店务分红: +${shopIncome}G`, "gold");
    if (wallRepair) log(`🔨 铁匠修复城墙: +${wallRepair}`, "success");
  } else {
    log("（本日已经结算，维护费不会重复扣除。）", "dim");
  }
  updateStatus();

  renderButtons([
    { text: "📈 升级店铺", action: tryUpgrade, type: "gold" },
    { text: "🌅 开始新的一天 →", action: startNewDay, type: "success" }
  ]);
}

// ===== 新的一天 =====
function startNewDay() {
  state.day++;
  state.phase = "morning";
  state.today = { revenue:0, expenses:0, customers:0, sales:0 };
  state.dungeonCooldown = Math.max(0, state.dungeonCooldown - 1);
  state.totalDays++;

  // 每五天强制进入一场城防战，不能绕过。
  if (state.day >= state.defense.nextDay) {
    state.phase = "defense";
    updateStatus();
    showDefenseBriefing();
    return;
  }

  clearLog();
  log(`<b>🌅 第 ${state.day} 天开始了！</b>`, "highlight");
  log("");
  log(`💰 当前资金: ${state.gold}G`);
  log(`📦 库存: ${state.inventory.length}件`);
  log(`🏪 店铺: ${state.shopLevel}级 ${SHOP_LEVELS[state.shopLevel].name}`);
  if (state.dungeonCooldown > 0) {
    log(`⏳ 地下城冷却: ${state.dungeonCooldown}天`, "dim");
  }
  log("");

  updateStatus();
  renderButtons([
    { text: "🌅 开始营业 →", action: showMainMenu, type: "success" }
  ]);
}

// ===== 升级店铺 =====
function tryUpgrade() {
  clearLog();
  const cfg = SHOP_LEVELS[state.shopLevel];

  if (!cfg.next) {
    log("<b>🏆 你已达到最高等级！</b>", "highlight");
    log("你已经是商业之神了。");
    renderButtons([{ text: "🔙 返回", action: showMainMenu }]);
    return;
  }

  const nextCfg = SHOP_LEVELS[cfg.next];
  log("<b>📈 升级店铺</b>", "highlight");
  log("");
  log(`当前: ${state.shopLevel}级 ${cfg.name}`);
  log(`下一级: ${cfg.next}级 ${nextCfg.name}`);
  log(`费用: <b>${cfg.cost}G</b>`);
  log(`资金: ${state.gold}G`);
  log("");
  log(`升级效果:`);
  log(`  货架容量: ${cfg.shelf} → ${nextCfg.shelf}`);
  log(`  库存上限: ${cfg.inv} → ${nextCfg.inv}`);
  log(`  每日维护: ${cfg.dailyCost} → ${nextCfg.dailyCost}G`);

  if (state.gold >= cfg.cost) {
    renderButtons([
      { text: `✅ 确认升级 (${cfg.cost}G)`, action: doUpgrade, type: "success" },
      { text: "🔙 算了", action: showMainMenu }
    ]);
  } else {
    log("", "danger");
    log(`❌ 资金不足！还需要 ${cfg.cost - state.gold}G`, "danger");
    renderButtons([{ text: "🔙 返回", action: showMainMenu }]);
  }
}

function doUpgrade() {
  const cfg = SHOP_LEVELS[state.shopLevel];
  state.gold -= cfg.cost;
  state.shopLevel = cfg.next;

  clearLog();
  log("<b>🎉 店铺升级成功！</b>", "highlight");
  log("");
  log(`现在你是 <b>${state.shopLevel}级 ${SHOP_LEVELS[state.shopLevel].name}</b> 了！`);
  log("");
  log("解锁新内容:");
  if (state.shopLevel === "E") {
    log("  ✅ 更多顾客类型（老手冒险者）");
    log("  ✅ 货架容量增加");
    log("  ✅ 可以进入E级地下城");
  } else if (state.shopLevel === "D") {
    log("  ✅ 贵族顾客可能出现");
    log("  ✅ 鉴定折扣");
  }

  updateStatus();
  renderButtons([
    { text: "🌅 开始新的一天", action: startNewDay, type: "success" }
  ]);
}
